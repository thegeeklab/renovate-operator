{{- if and .Values.networkPolicy.enabled .Values.receiver.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "renovate-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: controller-manager
  name: {{ include "renovate-operator.resourceName" (dict "suffix" "allow-receiver-traffic" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "renovate-operator.selectorLabels" $ | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector: {}
      ports:
        - port: 8083
          protocol: TCP
{{- end }}
