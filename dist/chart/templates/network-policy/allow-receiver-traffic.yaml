{{- if and .Values.networkPolicy.enabled .Values.receiver.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "renovate-operator.name" . }}
  name: {{ include "renovate-operator.resourceName" (dict "suffix" "allow-receiver-traffic" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "renovate-operator.name" . }}
      control-plane: controller-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector: {}
      ports:
        - port: 8083
          protocol: TCP
{{- end }}
