{{- if and .Values.manager.enabled .Values.frontend.enabled .Values.frontend.gateway.enabled }}
{{- if and .Values.frontend.gateway.gatewayName .Values.frontend.gateway.gatewayNamespace }}
{{- $gwNamespace := .Values.frontend.gateway.gatewayNamespace }}
{{- if ne $gwNamespace .Release.Namespace }}
{{- $gwName := .Values.frontend.gateway.gatewayName }}
{{- $fullname := include "renovate-operator.resourceName" (dict "suffix" "frontend" "context" $) }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ $fullname }}-gateway
  namespace: {{ $gwNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "renovate-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
    {{- with .Values.frontend.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ .Release.Namespace }}
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gwName }}
{{- end }}
{{- end }}
{{- end }}
