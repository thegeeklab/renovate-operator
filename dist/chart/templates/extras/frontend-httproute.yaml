{{- if and .Values.manager.enabled .Values.frontend.enabled .Values.frontend.gateway.enabled }}
{{- $fullname := include "renovate-operator.resourceName" (dict "suffix" "frontend" "context" $) }}
{{- $svcPort := int .Values.frontend.service.port -}}
{{- $gwName := default (printf "%s-gateway" $fullname) .Values.frontend.gateway.gatewayName }}
{{- $gwNamespace := default .Release.Namespace .Values.frontend.gateway.gatewayNamespace }}
{{- $ownGW := not .Values.frontend.gateway.gatewayName }}
{{- $sectionName := .Values.frontend.gateway.sectionName }}
{{- if and $ownGW (not $sectionName) }}
  {{- if .Values.frontend.gateway.listeners }}
    {{- $sectionName = (index .Values.frontend.gateway.listeners 0).name }}
  {{- else }}
    {{- $sectionName = "http" }}
  {{- end }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "renovate-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
    {{- with .Values.frontend.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.frontend.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $gwName }}
      namespace: {{ $gwNamespace }}
      {{- if $sectionName }}
      sectionName: {{ $sectionName | quote }}
      {{- end }}
  {{- with .Values.frontend.gateway.hosts }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        {{- if not .Values.frontend.gateway.paths }}
        - path:
            type: PathPrefix
            value: /
        {{- end }}
        {{- range $p := .Values.frontend.gateway.paths }}
        - path:
            type: {{ default "PathPrefix" $p.pathType | quote }}
            value: {{ $p.path | quote }}
        {{- end }}
      {{- with .Values.frontend.gateway.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ $fullname }}
          port: {{ $svcPort }}
      {{- with .Values.frontend.gateway.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
