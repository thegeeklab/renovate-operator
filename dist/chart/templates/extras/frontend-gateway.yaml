{{- if and .Values.manager.enabled .Values.frontend.enabled .Values.frontend.gateway.enabled }}
{{- $fullname := include "renovate-operator.resourceName" (dict "suffix" "frontend" "context" $) }}
{{- $gwName := default (printf "%s-gateway" $fullname) .Values.frontend.gateway.gatewayName }}
{{- $gwNamespace := default .Release.Namespace .Values.frontend.gateway.gatewayNamespace }}
{{- if not .Values.frontend.gateway.gatewayName }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gwName }}
  namespace: {{ $gwNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "renovate-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
    {{- with .Values.frontend.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.frontend.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ required "frontend.gateway.className is required when frontend.gateway.gatewayName is not set" .Values.frontend.gateway.className | quote }}
  {{- with .Values.frontend.gateway.addresses }}
  addresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.frontend.gateway.listeners }}
  listeners:
    {{- range $i, $l := .Values.frontend.gateway.listeners }}
    - name: {{ $l.name | default (printf "http-%d" $i) | quote }}
      port: {{ required "listeners[].port is required" $l.port }}
      protocol: {{ $l.protocol | default "HTTP" | quote }}
      {{- if $l.hostname }}
      hostname: {{ $l.hostname | quote }}
      {{- end }}
      {{- with $l.tls }}
      tls:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $l.allowedRoutes }}
      allowedRoutes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- else }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
  {{- end }}
{{- end }}
{{- end }}
