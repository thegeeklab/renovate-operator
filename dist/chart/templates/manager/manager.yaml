{{- if .Values.manager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "renovate-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
    {{- with .Values.manager.labels }}
    {{- with omit . "app.kubernetes.io/managed-by" "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "control-plane" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  name: {{ include "renovate-operator.resourceName" (dict "suffix" "controller-manager" "context" $) }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.manager.annotations }}
  annotations:
    {{- toYaml .Values.manager.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.manager.strategy }}
  strategy: {{ toYaml . | nindent 6 }}
  {{- end }}
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "renovate-operator.name" . }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.manager.pod }}
        {{- with .annotations }}
        {{- with omit . "kubectl.kubernetes.io/default-container" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "renovate-operator.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        control-plane: controller-manager
        {{- with .Values.manager.pod }}
        {{- with .labels }}
        {{- with omit . "app.kubernetes.io/name" "helm.sh/chart" "app.kubernetes.io/instance" "app.kubernetes.io/managed-by" "control-plane" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
    spec:
      {{- with .Values.manager.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.manager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - args:
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        - --metrics-cardinality-cap={{ .Values.metrics.cardinalityCap }}
        {{- if .Values.metrics.secure }}
        - --metrics-cert-path=/tmp/k8s-metrics-server/serving-certs
        - --metrics-cert-secret-name={{ include "renovate-operator.resourceName" (dict "suffix" "metrics-server-cert" "context" $) }}
        - --metrics-service-name={{ include "renovate-operator.resourceName" (dict "suffix" "metrics-service" "context" $) }}
        {{- if not .Values.certRotation.enabled }}
        - --metrics-cert-rotation=false
        {{- end }}
        {{- else }}
        - --metrics-secure=false
        {{- end }}
        {{- else }}
        # Bind to :0 to disable the controller-runtime managed metrics server
        - --metrics-bind-address=0
        {{- end }}
        - --health-probe-bind-address=:8081
        {{- range .Values.manager.args }}
        - {{ . }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        - --webhook-name={{ include "renovate-operator.resourceName" (dict "suffix" "webhook-configuration" "context" $) }}
        - --webhook-cert-secret-name={{ include "renovate-operator.resourceName" (dict "suffix" "webhook-server-cert" "context" $) }}
        - --webhook-service-name={{ include "renovate-operator.resourceName" (dict "suffix" "webhook-service" "context" $) }}
        {{- if not .Values.certRotation.enabled }}
        - --webhook-cert-rotation=false
        {{- end }}
        {{- end }}
        {{- if .Values.receiver.enabled }}
        - --receiver-bind-address=:8083
        {{- end }}
        command:
        - /manager
        - -zap-devel
        env:
{{- if or .Values.manager.env (and (kindIs "map" .Values.manager.envOverrides) (not (empty .Values.manager.envOverrides))) (not .Values.webhook.enabled) }}
          {{- if .Values.manager.env }}
          {{- toYaml .Values.manager.env | nindent 10 }}
          {{- end }}
          {{- if kindIs "map" .Values.manager.envOverrides }}
          {{- range $k, $v := .Values.manager.envOverrides }}
          - name: {{ $k | quote }}
            value: {{ $v | quote }}
          {{- end }}
          {{- end }}
          {{- if not .Values.webhook.enabled }}
          - name: ENABLE_WEBHOOKS
            value: "false"
          {{- end }}
{{- else }}
          []
{{- end }}
        image: "{{ .Values.manager.image.repository }}{{- if not (contains "@" .Values.manager.image.repository) }}:{{ .Values.manager.image.tag | default .Chart.AppVersion }}{{- end }}"
        {{- with .Values.manager.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: {{ .Values.webhook.port }}
          name: webhook-server
          protocol: TCP
        - containerPort: 8082
          name: frontend
          protocol: TCP
        {{- if .Values.receiver.enabled }}
        - containerPort: 8083
          name: receiver
          protocol: TCP
        {{- end }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- if .Values.manager.resources }}
          {{- toYaml .Values.manager.resources | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        securityContext:
          {{- if .Values.manager.securityContext }}
          {{- toYaml .Values.manager.securityContext | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        volumeMounts:
          {{- if .Values.manager.extraVolumeMounts }}
          {{- toYaml .Values.manager.extraVolumeMounts | nindent 10 }}
          {{- end }}
        {{- if .Values.metrics.enabled }}
        {{- if .Values.metrics.secure }}
        - mountPath: /tmp/k8s-metrics-server/serving-certs
          name: metrics-cert
          readOnly: true
        {{- end }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-cert
          readOnly: true
        {{- end }}
        - mountPath: /tmp/runner-logs
          name: log-storage
      securityContext:
        {{- if .Values.manager.podSecurityContext }}
        {{- toYaml .Values.manager.podSecurityContext | nindent 8 }}
        {{- else }}
        {}
        {{- end }}
      serviceAccountName: {{ include "renovate-operator.serviceAccountName" . }}
      {{- with .Values.manager.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      volumes:
        {{- if .Values.manager.extraVolumes }}
        {{- toYaml .Values.manager.extraVolumes | nindent 8 }}
        {{- end }}
      {{- if .Values.metrics.enabled }}
      {{- if .Values.metrics.secure }}
      - name: metrics-cert
        secret:
          defaultMode: 420
          secretName: {{ include "renovate-operator.resourceName" (dict "suffix" "metrics-server-cert" "context" $) }}
      {{- end }}
      {{- end }}
      {{- if .Values.webhook.enabled }}
      - name: webhook-cert
        secret:
          defaultMode: 420
          secretName: {{ include "renovate-operator.resourceName" (dict "suffix" "webhook-server-cert" "context" $) }}
      {{- end }}
      - emptyDir:
          sizeLimit: 100Mi
        name: log-storage
{{- end }}
