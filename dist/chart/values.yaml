---
# -- String to partially override chart.fullname template (will maintain the release name)
nameOverride: renovate-operator

# -- String to fully override chart.fullname template
fullnameOverride: ""

manager:
  # -- Set to false to skip manager installation
  enabled: true

  # -- Number of replicas for the manager deployment
  replicas: 1

  image:
    # -- Manager container image repository
    repository: docker.io/thegeeklab/renovate-operator
    # -- Image tag (defaults to Chart.appVersion if not set)
    # tag: ""
    # -- Manager container image pull policy
    pullPolicy: IfNotPresent

  # -- Image pull secrets for the manager pod
  # imagePullSecrets:
  #   - name: myregistrykey

  # -- Arguments passed to the manager container
  args:
    - --leader-elect
    - --frontend-bind-address=:8082

  # -- Environment variables for the manager container
  env:
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

  # -- Env overrides (--set manager.envOverrides.VAR=value)
  # Same name in env above: this value takes precedence.
  envOverrides: {}

  podSecurityContext:
    # -- Ensure the pod runs as a non-root user
    runAsNonRoot: true
    seccompProfile:
      # -- Type of seccomp profile
      type: RuntimeDefault

  securityContext:
    # -- Prevent privilege escalation
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  resources:
    limits:
      # -- CPU limit for the manager container
      cpu: 500m
      # -- Memory limit for the manager container
      memory: 128Mi
    requests:
      # -- CPU request for the manager container
      cpu: 10m
      # -- Memory request for the manager container
      memory: 64Mi

  # -- Node affinity rules for the manager pod
  affinity: {}

  # -- Node selector for the manager pod
  nodeSelector: {}

  # -- Tolerations for the manager pod
  tolerations: []

  # -- Deployment strategy
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  # -- Priority class name
  # priorityClassName: ""

  # -- Topology spread constraints
  # topologySpreadConstraints: []

  # -- Termination grace period seconds
  terminationGracePeriodSeconds: 10

  # -- Custom Deployment labels
  # labels: {}

  # -- Custom Deployment annotations
  # annotations: {}

  # -- Custom Pod labels and annotations
  # pod:
  #   labels: {}
  #   annotations: {}

  # -- Additional volumes to mount on the manager pod
  # extraVolumes: []

  # -- Additional volume mounts on the manager container
  # extraVolumeMounts: []

frontend:
  # -- Enable frontend Service, Ingress and Gateway resources
  enabled: true

  service:
    # -- Enable frontend Service resource
    enabled: true
    # -- Service type
    type: ClusterIP
    # -- Service port
    port: 80
    # -- Container port name (matches the named port on the manager container)
    targetPort: frontend
    # -- Node port (only when service.type=NodePort)
    # nodePort: 30080
    # -- Static cluster IP (only when service.type=ClusterIP)
    # clusterIP: ""
    # -- Session affinity
    sessionAffinity: None
    # -- Annotations added to the Service
    annotations: {}
    # -- Labels added to the Service
    labels: {}

  ingress:
    # -- Enable Ingress resource
    enabled: false
    # -- Ingress class name (e.g. "nginx")
    className: ""
    # -- Annotations added to the Ingress
    annotations: {}
    # -- Ingress hosts and paths
    hosts: []
    #   - host: renovate-operator.example.com
    #     paths:
    #       - path: /
    #         pathType: Prefix
    # -- Ingress TLS configuration
    tls: []
    #   - secretName: renovate-operator-tls
    #     hosts:
    #       - renovate-operator.example.com

  gateway:
    # -- Enable Gateway API HTTPRoute (and optionally a Gateway)
    enabled: false
    # -- Gateway class name (e.g. "nginx", "istio-waypoint", "traefik")
    className: ""
    # -- Labels added to the Gateway and HTTPRoute
    labels: {}
    # -- Annotations added to the HTTPRoute and created Gateway
    annotations: {}
    # -- HTTPRoute hostnames
    hosts: []
    #   - renovate-operator.example.com
    # -- HTTPRoute paths (shared across all hostnames)
    paths: []
    #   - path: /
    #     pathType: PathPrefix
    # -- Filters applied to all HTTPRoute rules
    filters: []
    #   - type: RequestHeaderModifier
    #     requestHeaderModifier:
    #       add:
    #         - name: X-Forwarded-Proto
    #           value: https
    # -- Timeouts for the HTTPRoute
    timeouts: {}
    #   request: 30s
    # -- Section name of the Gateway listener to attach the HTTPRoute to.
    # When empty and a new Gateway is created, the first listener name is used.
    # sectionName: ""
    # -- Existing Gateway to attach the HTTPRoute to. When empty and listeners
    # are not empty, a new Gateway is created in the release namespace.
    # gatewayName: ""
    # gatewayNamespace: ""
    # -- Gateway addresses (only when creating a new Gateway)
    addresses: []
    #   - type: IPAddress
    #     value: 192.168.1.1
    # -- Gateway listeners to create when gatewayName is empty
    listeners: []
    #   - name: http
    #     port: 80
    #     protocol: HTTP
    #   - name: https
    #     port: 443
    #     protocol: HTTPS
    #     hostname: renovate-operator.example.com
    #     tls:
    #       mode: Terminate
    #       certificateRefs:
    #         - name: renovate-operator-tls
    #           kind: Secret

# -- Webhook receiver configuration for Git platform webhooks
receiver:
  # -- Enable the webhook receiver server (--receiver-bind-address)
  enabled: false

  service:
    # -- Enable receiver Service resource
    enabled: true
    # -- Service type
    type: ClusterIP
    # -- Service port
    port: 80
    # -- Container port name (matches the named port on the manager container)
    targetPort: receiver
    # -- Node port (only when service.type=NodePort)
    # nodePort: 30083
    # -- Static cluster IP (only when service.type=ClusterIP)
    # clusterIP: ""
    # -- Session affinity
    sessionAffinity: None
    # -- Annotations added to the Service
    annotations: {}
    # -- Labels added to the Service
    labels: {}

  ingress:
    # -- Enable Ingress resource
    enabled: false
    # -- Ingress class name (e.g. "nginx")
    className: ""
    # -- Annotations added to the Ingress
    annotations: {}
    # -- Ingress hosts and paths
    hosts: []
    #   - host: renovate-receiver.example.com
    #     paths:
    #       - path: /
    #         pathType: Prefix
    # -- Ingress TLS configuration
    tls: []
    #   - secretName: renovate-receiver-tls
    #     hosts:
    #       - renovate-receiver.example.com

  gateway:
    # -- Enable Gateway API HTTPRoute (and optionally a Gateway)
    enabled: false
    # -- Gateway class name (e.g. "nginx", "istio-waypoint", "traefik")
    className: ""
    # -- Labels added to the Gateway and HTTPRoute
    labels: {}
    # -- Annotations added to the HTTPRoute and created Gateway
    annotations: {}
    # -- HTTPRoute hostnames
    hosts: []
    #   - renovate-receiver.example.com
    # -- HTTPRoute paths (shared across all hostnames)
    paths: []
    #   - path: /
    #     pathType: PathPrefix
    # -- Filters applied to all HTTPRoute rules
    filters: []
    #   - type: RequestHeaderModifier
    #     requestHeaderModifier:
    #       set:
    #         - name: X-Forwarded-Proto
    #           value: https
    # -- Timeouts for the HTTPRoute
    timeouts: {}
    #   request: 30s
    # -- Section name of the Gateway listener to attach the HTTPRoute to.
    # When empty and a new Gateway is created, the first listener name is used.
    # sectionName: ""
    # -- Existing Gateway to attach the HTTPRoute to. When empty and listeners
    # are not empty, a new Gateway is created in the release namespace.
    # gatewayName: ""
    # gatewayNamespace: ""
    # -- Gateway addresses (only when creating a new Gateway)
    addresses: []
    #   - type: IPAddress
    #     value: 192.168.1.1
    # -- Gateway listeners to create when gatewayName is empty
    listeners: []
    #   - name: https
    #     port: 443
    #     protocol: HTTPS
    #     hostname: renovate-receiver.example.com
    #     tls:
    #       mode: Terminate
    #       certificateRefs:
    #         - name: renovate-receiver-tls
    #           kind: Secret

rbac:
  # -- RBAC resource scope
  # - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  # - true: Role/RoleBinding (release namespace only)
  #
  # WARNING: When set to false (default), the manager ClusterRole grants full CRUD on
  # roles and rolebindings across all namespaces. If the operator is compromised, an attacker
  # could create a ClusterRoleBinding granting cluster-admin. Consider using rbac.namespaced=true
  # for reduced privilege escalation surface.
  namespaced: false

  # -- Helper roles for CRD management (admin/editor/viewer)
  helpers:
    # -- Install convenience admin/editor/viewer roles for CRDs
    enabled: false

serviceAccount:
  # -- Install default ServiceAccount provided
  enabled: true

  # -- Existing ServiceAccount name (only when enabled=false)
  # Note: When enabled=true, respects nameOverride/fullnameOverride
  # name: ""

  # -- Custom ServiceAccount annotations
  # annotations: {}

  # -- Custom ServiceAccount labels
  # labels: {}

crd:
  # -- Install CRDs with the chart
  enabled: true
  # -- Keep CRDs when uninstalling
  keep: true

metrics:
  # -- Enable the metrics endpoint
  enabled: true
  # -- Metrics server port
  port: 8443
  # -- Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true
  # -- Maximum number of unique label combinations tracked before series are dropped.
  cardinalityCap: 5000

certRotation:
  # -- Enable the operator's built-in certificate rotation (cert-controller).
  # Disable this if you provide certificates via an external tool such as cert-manager.
  enabled: true

webhook:
  # -- Enable the validating/mutating webhook server
  enabled: true
  # -- Webhook server port
  port: 9443
  # -- Annotations added to the MutatingWebhookConfiguration.
  # Useful for CA injection, e.g. cert-manager.io/inject-ca-from.
  annotations: {}

prometheus:
  # -- Create ServiceMonitor resources for Prometheus Operator
  enabled: false

networkPolicy:
  # -- Create NetworkPolicy resources for the manager pod
  enabled: false
