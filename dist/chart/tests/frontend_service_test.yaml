---
suite: test frontend service
templates:
  - templates/manager/frontend-service.yaml
tests:
  - it: should render the frontend service with default values
    asserts:
      - isKind:
          of: Service
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-renovate-operator-frontend
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: frontend
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: renovate-operator
            control-plane: controller-manager
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: renovate-operator
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: frontend

  - it: should allow customizing service type and port
    set:
      frontend.service.type: NodePort
      frontend.service.port: 8080
      frontend.service.nodePort: 30080
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].nodePort
          value: 30080

  - it: should propagate service annotations and labels
    values:
      - ./fixtures/service-annotations.yaml
    asserts:
      - equal:
          path: metadata.annotations["service.beta.openshift.io/serving-cert-secret-name"]
          value: foo
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: renovate

  - it: should not render frontend service when manager is disabled
    set:
      manager.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render frontend service when frontend is disabled
    set:
      frontend.enabled: false
    asserts:
      - hasDocuments:
          count: 0
