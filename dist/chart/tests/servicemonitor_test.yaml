suite: test servicemonitor resources
templates:
  - templates/prometheus/controller-manager-metrics-monitor.yaml
tests:
  - it: should not render servicemonitor by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render servicemonitor when prometheus is enabled
    release:
      name: renovate
    set:
      prometheus.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: renovate-controller-manager-metrics-monitor

  - it: should configure TLS when metrics secure is enabled
    release:
      name: renovate
      namespace: default
    set:
      prometheus.enabled: true
      metrics.secure: true
    asserts:
      - equal:
          path: spec.endpoints[0].scheme
          value: https
      - equal:
          path: spec.endpoints[0].port
          value: https
      - equal:
          path: spec.endpoints[0].tlsConfig.serverName
          value: renovate-metrics-service.default.svc
      - equal:
          path: spec.endpoints[0].tlsConfig.ca.secret.name
          value: renovate-metrics-server-cert
      - equal:
          path: spec.endpoints[0].tlsConfig.ca.secret.key
          value: ca.crt
      - equal:
          path: spec.endpoints[0].bearerTokenFile
          value: /var/run/secrets/kubernetes.io/serviceaccount/token

  - it: should not configure TLS when metrics secure is disabled
    release:
      name: renovate
    set:
      prometheus.enabled: true
      metrics.secure: false
    asserts:
      - equal:
          path: spec.endpoints[0].scheme
          value: http
      - equal:
          path: spec.endpoints[0].port
          value: http
      - isNull:
          path: spec.endpoints[0].tlsConfig
      - isNull:
          path: spec.endpoints[0].bearerTokenFile