---
suite: test receiver network policy
templates:
  - templates/network-policy/allow-receiver-traffic.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when enabled
    set:
      networkPolicy.enabled: true
      receiver.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-renovate-operator-allow-receiver-traffic
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: renovate-operator
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: controller-manager
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: renovate-operator
      - equal:
          path: spec.podSelector.matchLabels["control-plane"]
          value: controller-manager
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8083
      - equal:
          path: spec.ingress[0].ports[0].protocol
          value: TCP
      - isNull:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels

  - it: should not render when receiver is disabled
    set:
      networkPolicy.enabled: true
      receiver.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when networkPolicy is disabled
    set:
      networkPolicy.enabled: false
      receiver.enabled: true
    asserts:
      - hasDocuments:
          count: 0

