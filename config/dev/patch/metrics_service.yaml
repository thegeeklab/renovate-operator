---
apiVersion: v1
kind: Service
metadata:
  name: renovate-operator-metrics-service
  namespace: renovate-system
spec:
  $patch: replace
  type: NodePort
  ports:
    - name: metrics
      port: 8080
      nodePort: 30880
      targetPort: 8080
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: renovate-operator
