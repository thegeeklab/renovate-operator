---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: renovate-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: v1
kind: Secret
metadata:
  name: webhook-server-cert
  namespace: system
---
apiVersion: v1
kind: Secret
metadata:
  name: metrics-server-cert
  namespace: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: renovate-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: renovate-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: renovate-operator
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - command:
            - /manager
            - -zap-devel
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-cert-path=/tmp/k8s-metrics-server/serving-certs
            - --metrics-cert-secret-name=renovate-operator-metrics-server-cert
            - --metrics-service-name=renovate-operator-metrics-service
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
            - --webhook-name=renovate-operator-webhook-configuration
            - --webhook-cert-secret-name=renovate-operator-webhook-server-cert
            - --webhook-service-name=renovate-operator-webhook-service
            - --frontend-bind-address=:8082
          image: docker.io/thegeeklab/renovate-operator:latest
          name: manager
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
            - containerPort: 8082
              name: frontend
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - mountPath: /tmp/k8s-metrics-server/serving-certs
              name: metrics-cert
              readOnly: true
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: webhook-cert
              readOnly: true
            - mountPath: /tmp/runner-logs
              name: log-storage
      volumes:
        - name: metrics-cert
          secret:
            defaultMode: 420
            secretName: renovate-operator-metrics-server-cert
        - name: webhook-cert
          secret:
            defaultMode: 420
            secretName: renovate-operator-webhook-server-cert
        - name: log-storage
          emptyDir:
            sizeLimit: 100Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
