---
apiVersion: renovate.thegeeklab.de/v1beta1
kind: Runner
metadata:
  labels:
    app.kubernetes.io/name: renovate-operator
    app.kubernetes.io/managed-by: kustomize
  name: runner-sample
spec:
  # Container image for the runner job.
  # Defaults to "docker.io/thegeeklab/renovate-operator:latest".
  image: ghcr.io/thegeeklab/renovate-operator:latest

  # Image pull policy. One of Always, Never, IfNotPresent.
  # Defaults to IfNotPresent.
  imagePullPolicy: IfNotPresent

  # List of secrets for pulling images from private registries.
  # imagePullSecrets:
  #   - name: registry-credentials

  # Runner log level. One of: trace, debug, info, warn, error, fatal.
  # Defaults to "info".
  logging:
    level: info

  # Reference to a ConfigMap with additional runner configuration.
  # configRef: runner-config

  # Pause runner scheduling. Defaults to false.
  suspend: false

  # Cron schedule for running Renovate against discovered repositories.
  # Defaults to "0 */2 * * *".
  schedule: "0 0 * * *"

  # IANA timezone for evaluating the cron schedule (e.g. "Europe/Berlin").
  # Defaults to the operator pod's local timezone.
  # timezone: "UTC"

  # Number of completed jobs to retain for history.
  # Defaults to 3.
  # successLimit: 3

  # Number of failed jobs to retain for history.
  # Defaults to 1.
  # failedLimit: 1

  # Number of retries before marking a job as failed.
  # Defaults to 0.
  # backoffLimit: 0

  # Maximum number of Renovate jobs running concurrently.
  # 0 means unlimited. Defaults to 0.
  # maxParallel: 5

  # Pod scheduling and resource configuration.

  # nodeSelector:
  #   kubernetes.io/arch: amd64

  # resources:
  #   requests:
  #     cpu: 200m
  #     memory: 256Mi
  #   limits:
  #     cpu: "1"
  #     memory: 1Gi

  # securityContext:
  #   runAsNonRoot: true
  #   runAsUser: 1000

  # extraEnv:
  #   - name: MY_VAR
  #     value: "my-value"

  # extraVolumes:
  #   - name: custom-config
  #     configMap:
  #       name: my-config

  # podAnnotations:
  #   prometheus.io/scrape: "true"

  # Scratch volume for RENOVATE_BASE_DIR.
  # scratchVolume:
  #   path: /tmp/renovate
  #   medium: ""
  #   sizeLimit: 1Gi
