root = "."
tmp_dir = "tmp"

[build]
cmd = "make gen-icons && make templ && make build-go"
bin = "./bin/manager"
args_bin = [
  "-zap-log-level=debug",
  "--metrics-bind-address=:8080",
  "--metrics-secure=false",
  "--receiver-bind-address=:8083",
  "--external-url=http://renovate-operator-receiver-service.renovate-system.svc.cluster.local:8083",
]

include_ext = ["go", "templ"]
exclude_dir = ["tmp", "vendor", "node_modules", "dist", "test", "config"]
include_dir = ["cmd", "internal", "hack"]
exclude_regex = ["_test\\.go", "_templ\\.go"]

[log]
time = true
