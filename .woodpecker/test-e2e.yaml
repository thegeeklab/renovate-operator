---
when:
  - event: [pull_request]
  - event: [push, manual]
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}

variables:
  - &when_e2e
    - path:
        include:
          - ".woodpecker/test-e2e.yaml"
          - "**/*.go"
          - "go.*"
          - "Makefile"
          - "config/**"
          - "dist/**"

services:
  - name: k3d
    image: ghcr.io/k3d-io/k3d:5-dind
    privileged: true
    commands:
      - nohup dockerd-entrypoint.sh &
      - until docker ps 2>&1 >/dev/null; do sleep 1s; done
      - k3d cluster create renovate-operator --api-port k3d:6445
      - k3d kubeconfig get renovate-operator > kubeconfig-$${CI_BUILD_NUMBER}.yaml
      - chmod 0600 kubeconfig-$${CI_BUILD_NUMBER}.yaml
      - |
        docker build -t docker.io/thegeeklab/renovate-operator:e2e \
          -f Containerfile.multiarch .
      - k3d image import \ docker.io/thegeeklab/renovate-operator:e2e \ --name renovate-operator
      - kubectl get pods -Aw
      - printf '@@@@@@@@@@@@@@@@@@@@@@@\n@@@@ k3d is ready @@@@\n@@@@@@@@@@@@@@@@@@@@@@@\n'

steps:
  - name: restore-go-cache
    image: quay.io/thegeeklab/wp-s3-action
    settings:
      action: [download]
      archive: True
      bucket:
        from_secret: s3_bucket_cache
      endpoint:
        from_secret: s3_endpoint
      path_style: true
      source: /woodpecker/cache/go
      target: '{{ .Repository.Slug }}/go/{{ sha256file "go.mod" "go.sum" }}.tar.gz'
      access_key:
        from_secret: s3_access_key_cache
      secret_key:
        from_secret: s3_secret_access_key_cache
    when: *when_e2e

  - name: e2e
    image: docker.io/library/golang:1.27.2
    depends_on: [restore-go-cache]
    environment:
      GOCACHE: /woodpecker/cache/go/build
      GOMODCACHE: /woodpecker/cache/go/mod
      GOWORK: "off"
      KUBECONFIG: kubeconfig-${CI_BUILD_NUMBER}.yaml
      E2E_IMAGE: docker.io/thegeeklab/renovate-operator:e2e
    commands:
      - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      - make test-e2e
    when: *when_e2e

  - name: save-go-cache
    image: quay.io/thegeeklab/wp-s3-action
    depends_on: [e2e]
    settings:
      action: [upload]
      archive: True
      bucket:
        from_secret: s3_bucket_cache
      endpoint:
        from_secret: s3_endpoint
      path_style: true
      source: /woodpecker/cache/go
      upload_allow_empty_source: True
      target: '{{ .Repository.Slug }}/go/{{ sha256file "go.mod" "go.sum" }}.tar.gz'
      access_key:
        from_secret: s3_access_key_cache
      secret_key:
        from_secret: s3_secret_access_key_cache
    when: *when_e2e
