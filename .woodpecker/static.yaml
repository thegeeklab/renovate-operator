---
when:
  - event: [pull_request]
  - event: [push, manual]
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}

variables:
  - &when
    - path:
        exclude: &exclude_path
          - internal/frontend/i18n/locales/*.json
  - &when_golang
    - path:
        include:
          - ".woodpecker/test.yaml"
          - ".golangci.yaml"
          # go source code
          - "**/*.go"
          - "go.*"
          # tools updates
          - "Makefile"

steps:
  - name: restore-node-cache
    image: quay.io/thegeeklab/wp-s3-action
    settings:
      action: [download]
      archive: True
      bucket:
        from_secret: s3_bucket_cache
      endpoint:
        from_secret: s3_endpoint
      path_style: true
      source: node_modules
      target: '{{ .Repository.Slug }}/node/{{ sha256file "package-lock.json" }}.tar.gz'
      access_key:
        from_secret: s3_access_key_cache
      secret_key:
        from_secret: s3_secret_access_key_cache
    when: *when

  - name: restore-go-cache
    image: quay.io/thegeeklab/wp-s3-action
    settings:
      action: [download]
      archive: True
      bucket:
        from_secret: s3_bucket_cache
      endpoint:
        from_secret: s3_endpoint
      path_style: true
      source: .cache/go
      target: '{{ .Repository.Slug }}/go/{{ sha256file "go.mod" "go.sum" }}.tar.gz'
      access_key:
        from_secret: s3_access_key_cache
      secret_key:
        from_secret: s3_secret_access_key_cache
    when: *when_golang

  - name: frontend-deps
    image: docker.io/library/node:lts
    depends_on: [restore-node-cache]
    commands:
      - make frontend-deps
    when: *when

  - name: eslint
    image: docker.io/library/node:lts
    depends_on: [frontend-deps]
    commands:
      - make eslint typecheck
    when: *when

  - name: markdownlint
    image: quay.io/thegeeklab/markdownlint-cli
    depends_on: [frontend-deps]
    commands:
      - markdownlint 'docs/*.md' 'dist/chart/README.md' 'README.md' 'CONTRIBUTING.md'
    when: *when

  - name: yaml-lint
    image: docker.io/library/golang:1.27.1
    depends_on: [frontend-deps]
    commands:
      - make yamlfmt-lint
    when: *when

  - name: spellcheck
    image: docker.io/library/node:lts
    depends_on: [frontend-deps]
    commands:
      - make cspell
    when: *when

  - name: golangci-lint
    image: docker.io/golangci/golangci-lint:v2.14.0
    depends_on: [frontend-deps, restore-go-cache]
    commands:
      - export GOCACHE="$CI_WORKSPACE/.cache/go/build"
      - export GOMODCACHE="$CI_WORKSPACE/.cache/go/mod"
      - go mod download
      - golangci-lint run
    when: *when_golang

  - name: helm-lint
    image: quay.io/helmpack/chart-testing:v3.14.0
    depends_on: [frontend-deps]
    commands:
      - ct list-changed --target-branch ${CI_REPO_DEFAULT_BRANCH} --chart-dirs dist
      - ct lint --target-branch ${CI_REPO_DEFAULT_BRANCH} --chart-dirs dist --validate-maintainers=false --check-version-increment=false
    when: *when

  - name: verify-installer
    image: docker.io/library/golang:1.27.1
    depends_on: [frontend-deps]
    commands:
      - make build-installer
      - git diff --exit-code
    when: *when

  - name: format-locale
    image: docker.io/jauderho/prettier:3.9.9
    commands:
      - prettier -w internal/frontend/i18n/locales/*.json
    when:
      - path:
          include: *exclude_path

  - name: verify-locale
    image: docker.io/library/golang:1.27.1
    depends_on: [format-locale]
    commands:
      - git diff --exit-code
    when:
      - path:
          include: *exclude_path

  - name: save-node-cache
    image: quay.io/thegeeklab/wp-s3-action
    depends_on: [frontend-deps]
    settings:
      action: [upload]
      archive: True
      bucket:
        from_secret: s3_bucket_cache
      endpoint:
        from_secret: s3_endpoint
      path_style: true
      source: node_modules
      upload_allow_empty_source: True
      target: '{{ .Repository.Slug }}/node/{{ sha256file "package-lock.json" }}.tar.gz'
      access_key:
        from_secret: s3_access_key_cache
      secret_key:
        from_secret: s3_secret_access_key_cache
    when: *when

  - name: save-go-cache
    image: quay.io/thegeeklab/wp-s3-action
    depends_on: [golangci-lint]
    settings:
      action: [upload]
      archive: True
      bucket:
        from_secret: s3_bucket_cache
      endpoint:
        from_secret: s3_endpoint
      path_style: true
      source: .cache/go
      upload_allow_empty_source: True
      target: '{{ .Repository.Slug }}/go/{{ sha256file "go.mod" "go.sum" }}.tar.gz'
      access_key:
        from_secret: s3_access_key_cache
      secret_key:
        from_secret: s3_secret_access_key_cache
    when: *when_golang
