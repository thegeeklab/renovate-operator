---
when:
  - event: [pull_request, tag]
  - event: [push, manual]
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}

variables:
  - path: &locale_path
      - internal/frontend/i18n/locales/*.json

steps:
  - name: changelog
    image: quay.io/thegeeklab/git-sv
    depends_on: []
    commands:
      - git sv current-version
      - git sv release-notes -t ${CI_COMMIT_TAG:-next} -o CHANGELOG.md
      - cat CHANGELOG.md
    when:
      - path:
          exclude: *locale_path

  - name: chart-version
    image: quay.io/thegeeklab/kube-tools
    depends_on: []
    commands:
      - export VERSION="${CI_COMMIT_TAG#v}"
      - yq eval '.version = strenv(VERSION)' -i dist/chart/Chart.yaml
      - yq eval '.appVersion = strenv(VERSION)' -i dist/chart/Chart.yaml
    when:
      - path:
          exclude: *locale_path

  - name: helm-docs
    image: docker.io/jnorwood/helm-docs:v1.14.2
    depends_on: [chart-version]
    commands:
      - helm-docs -c dist/chart/
    when:
      - path:
          exclude: *locale_path

  - name: prettier
    image: docker.io/jauderho/prettier:3.9.6
    depends_on: [helm-docs]
    commands:
      - prettier -w dist/chart/README.md
    when:
      - path:
          exclude: *locale_path

  - name: publish-github
    image: docker.io/plugins/github-release
    depends_on: [prettier]
    settings:
      api_key:
        from_secret: github_token
      files:
        - dist/install.yaml
      note: CHANGELOG.md
      overwrite: true
      title: ${CI_COMMIT_TAG}
    when:
      - event: [tag]

  - name: publish-chart-dockerhub
    image: quay.io/thegeeklab/kube-tools
    depends_on: [publish-github]
    environment:
      DOCKER_USERNAME:
        from_secret: docker_username
      DOCKER_PASSWORD:
        from_secret: docker_password
    commands:
      - echo "$DOCKER_PASSWORD" | helm registry login docker.io --username "$DOCKER_USERNAME" --password-stdin
      - helm package dist/chart/ --destination dist/
      - helm push dist/*.tgz oci://docker.io/thegeeklab
    when:
      - event: [tag]

  - name: publish-chart-quay
    image: quay.io/thegeeklab/kube-tools
    depends_on: [publish-github]
    environment:
      QUAY_USERNAME:
        from_secret: quay_username
      QUAY_PASSWORD:
        from_secret: quay_password
    commands:
      - echo "$QUAY_PASSWORD" | helm registry login quay.io --username "$QUAY_USERNAME" --password-stdin
      - helm package dist/chart/ --destination dist/
      - helm push dist/*.tgz oci://quay.io/thegeeklab
    when:
      - event: [tag]

depends_on:
  - static
  - test
