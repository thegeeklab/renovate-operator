---
when:
  - event: [pull_request, tag]
  - event: [push, manual]
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}

variables:
  - path: &locale_path
      - internal/frontend/i18n/locales/*.json

steps:
  - name: test
    image: docker.io/library/golang:1.26.5
    commands:
      - make test
    when:
      - path:
          exclude: *locale_path

  - name: test-locale
    image: docker.io/library/golang:1.26.5
    commands:
      - make test FOCUS="Bundle|ClientJSON|SupportedLocales|Translator"
    when:
      - path:
          include: *locale_path

  - name: helm-test
    image: quay.io/thegeeklab/kube-tools
    commands:
      - make helm-test
    when:
      - path:
          exclude: *locale_path
